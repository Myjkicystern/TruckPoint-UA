<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Головна</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#edf3ff;
min-height:100vh;
}


header{
background:linear-gradient(135deg,#0057ff,#00a2ff);
color:white;
padding:20px;
border-radius:0 0 25px 25px;
box-shadow:0 5px 15px #0003;
text-align:center;
}

.logo{
font-size:28px;
font-weight:700;
}

.user{
margin-top:8px;
font-size:15px;
font-weight:500;
}



.container{

padding:15px;
max-width:600px;
margin:auto;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:15px;

}



.card{

background:white;
border-radius:18px;
height:130px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-shadow:0 6px 15px #0002;
cursor:pointer;
transition:.2s;
-webkit-tap-highlight-color:transparent;

}



.card:active{

transform:scale(.96);

}



.icon{

font-size:38px;

}



.title{

margin-top:8px;
font-size:15px;
font-weight:600;
text-align:center;

}



/* Телефон */

@media(max-width:480px){


header{

padding:16px;

}


.logo{

font-size:23px;

}


.grid{

grid-template-columns:1fr;
gap:12px;

}



.card{

height:95px;
flex-direction:row;
justify-content:flex-start;
padding-left:25px;

}



.icon{

font-size:35px;
width:60px;

}



.title{

font-size:16px;
margin-top:0;

}


}


/* Планшет */

@media(min-width:700px){


.container{

max-width:750px;

}


.card{

height:150px;

}


}

.card,
.card *{
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

</style>

</head>


<body>


<header>

<div class="logo">
TruckPoint UA
</div>

<div class="user" id="userInfo">
👤 Завантаження...
</div>

</header>



<div class="container">

<div class="grid">


<div class="card" onclick="location.href='Точки зацікавленості.html'">
<div class="icon">🗺️</div>
<div class="title">Точки Зацікавленості</div>
</div>

<div class="card" onclick="location.href='Для відпочинку.html'">
<div class="icon">☕</div>
<div class="title">Для відпочинку</div>
</div>

<div class="card" onclick="location.href='https://for-driver.info/ua/traffic-ban.html'">
<div class="icon">⚠️</div>
<div class="title">Заборони руху</div>
</div>

<div class="card" onclick="location.href='Користувачі.html'">
    <div class="icon">📡</div>
    <div class="title">Користувачі на мапі</div>
</div>

<div class="card" onclick="location.href='Коментарі.html'">
    <div class="icon">💬</div>
    <div class="title">Додати коментар</div>
</div>

<div class="card" onclick="logout()">
<div class="icon">🚪</div>
<div class="title">Вийти</div>
</div>


</div>

</div>



<script>


const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL: "https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId: "truckpoint-ua",

storageBucket: "truckpoint-ua.firebasestorage.app",

messagingSenderId: "992372126132",

appId: "1:992372126132:web:3378b6b1794066132d42e1"

};


if(!firebase.apps.length){

firebase.initializeApp(firebaseConfig);

}
const auth = firebase.auth();
const db = firebase.database();


firebase.auth().onAuthStateChanged(user=>{


if(!user){

    window.location.replace("index.html");
    return;

}


db.ref("users/" + user.uid).once("value").then(snapshot=>{


let name="Користувач";


if(snapshot.exists() && snapshot.val().name){

    name=snapshot.val().name;

}
else if(localStorage.getItem("userName")){

    name=localStorage.getItem("userName");

}
else if(user.displayName){

    name=user.displayName;

}


// онлайн

const statusRef=db.ref("online/"+user.uid);
const connectedRef=db.ref(".info/connected");
let USER_ID = localStorage.getItem("USER_ID");

if (!USER_ID) {
    USER_ID = "user_" + crypto.randomUUID();
    localStorage.setItem("USER_ID", USER_ID);
}

const showLocation =
    localStorage.getItem("showLocation") !== "false";


connectedRef.on("value",snap=>{


if(snap.val()===true){


statusRef.onDisconnect().remove();
db.ref("usersLocation/" + USER_ID)
    .onDisconnect()
    .update({
        online: false,
        lastUpdate: firebase.database.ServerValue.TIMESTAMP
    });

statusRef.set({

name:name,
time:firebase.database.ServerValue.TIMESTAMP

});
if (showLocation && navigator.geolocation) {

    navigator.geolocation.getCurrentPosition((position)=>{

        db.ref("usersLocation/" + USER_ID).set({

            name: name,
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            online: true,
            showLocation: true,
            lastUpdate: Date.now()

        });

    });

    navigator.geolocation.watchPosition((position)=>{

        db.ref("usersLocation/" + USER_ID).update({

            lat: position.coords.latitude,
            lng: position.coords.longitude,
            online: true,
            lastUpdate: Date.now()

        });

    });

}


}


});



// шапка

function updateHeader(){


db.ref("users").once("value").then(usersSnap=>{


let usersCount=usersSnap.numChildren();


db.ref("online").once("value").then(onlineSnap=>{


let onlineCount=onlineSnap.numChildren();


document.getElementById("userInfo").innerHTML=

"👤 "+name+
"<br>👥 Користувачів: "+usersCount+
"<br>🟢 Онлайн: "+onlineCount;


});


});


}


updateHeader();

setInterval(updateHeader,10000);


});


});

function logout() {

    const user = auth.currentUser;

    if (!user) {
        window.location.replace("index.html");
        return;
    }

    db.ref("online/" + user.uid).remove().finally(() => {
        auth.signOut();
    });

}


</script>


</body>
</html>
