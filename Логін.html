<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реєстрація</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#0f172a,#1e293b);
}

.register-box{
    width:90%;
    max-width:350px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    color:white;
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn:active{
    transform:scale(.98);
}
</style>
</head>
<body>

<div class="register-box">
    <div class="logo"><h1>TruckPoint UA</h1></div>

    <h1>Реєстрація</h1>

    <div class="input-group">
        <label>Ім'я</label>
        <input type="text" id="name" placeholder="Ваше ім'я">
    </div>

    <div class="input-group">
        <label>Номер телефону</label>
        <input type="tel" id="phone" placeholder="+380 XX XXX XX XX">
    </div>

    <button class="btn" onclick="register()">
        Продовжити
    </button>
</div>

<script>
function register(){
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;

    if(!name || !phone){
        alert('Заповніть усі поля');
        return;
    }

    localStorage.setItem('userName', name);
    localStorage.setItem('userPhone', phone);

    alert('Реєстрація успішна!');

    // Перехід на головну сторінку
    window.location.href = "index.html";
}
type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXXXXXX",
  appId: "XXXXXXXX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.register = function() {

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if (!name || !phone) {
    alert("Заповніть усі поля");
    return;
  }

  const userRef = push(ref(db, 'users'));

  set(userRef, {
    name: name,
    phone: phone,
    createdAt: Date.now()
  })
  .then(() => {
    localStorage.setItem("userName", name);
    localStorage.setItem("userPhone", phone);

    alert("Реєстрація успішна!");
    window.location.href = "index.html";
  })
  .catch(error => {
    alert("Помилка: " + error.message);
  });
}
</script>

</body>
</html>
